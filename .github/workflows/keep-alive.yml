# Pings the Render free instance every 10 minutes so it never spins down.
# Set repo secret CINEPRO_PING_URL to the service URL (e.g. https://cinepro-core.onrender.com).
name: Keep-alive ping

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CinePro health endpoint
        run: |
          URL="${{ secrets.CINEPRO_PING_URL }}"
          if [ -z "$URL" ]; then echo "CINEPRO_PING_URL not set - skipping"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL/v1")
          echo "GET $URL/v1 -> HTTP $code"
